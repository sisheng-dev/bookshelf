<!--
  my shelf — library site
  VERSION: real epub upload + reader, dark mode, decor cleanup
  updated: 2026-08-15
  changes in this version:
    - removed the decorative teardrop icons in the corners
    - dark mode toggle is now a floating button fixed to the
      top-right corner (doesn't move with scroll)
    - "add a book" now actually parses the uploaded .epub with
      epub.js: real title, author, and cover image if present
    - "open book" now opens a real in-browser reader (epub.js),
      with prev/next buttons and arrow-key page turning
    - everything happens client-side — no backend/server needed,
      nothing is uploaded anywhere
    - books and uploaded EPUB files are saved locally in this browser
      with IndexedDB, so they survive page refreshes; clearing site
      data will remove them
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF5F8;
    --ink: #453645;
    --ink-soft: #9184A0;
    --pink: #D98FB8;
    --pink-deep: #C773A3;
    --lavender: #B8A9D9;
    --sage: #9CB89E;
    --clay: #D69A78;
    --blush: #F7E0EC;
    --blush-deep: #F0C9DD;
    --card: #FFFFFF;
    --line: #F0D9E6;
    --card-shadow: 0 8px 22px -12px rgba(153, 68, 116, 0.18);
    --card-shadow-hover: 0 18px 34px -14px rgba(153, 68, 116, 0.3);
  }

  html[data-theme="dark"] {
    --bg: #251C2C;
    --ink: #F3E7EF;
    --ink-soft: #B29FC2;
    --pink: #E8A8CE;
    --pink-deep: #F0B8D8;
    --lavender: #C7B8ED;
    --sage: #A8CBA9;
    --clay: #E3AC87;
    --blush: #3B2E45;
    --blush-deep: #4A3856;
    --card: #322639;
    --line: #453750;
    --card-shadow: 0 8px 24px -12px rgba(0, 0, 0, 0.45);
    --card-shadow-hover: 0 18px 36px -14px rgba(0, 0, 0, 0.55);
  }

  body, .stat-card, .modal, .cover, .shelf-tab, #search, .field input,
  .spotlight-card, .fav-btn, .fav-toggle, .book .meta .title, .book .meta .author {
    transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 12% 0%, rgba(217, 143, 184, 0.16) 0%, transparent 38%),
      radial-gradient(circle at 88% 8%, rgba(184, 169, 217, 0.14) 0%, transparent 36%),
      radial-gradient(circle at 8% 92%, rgba(217, 143, 184, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 95% 85%, rgba(156, 184, 158, 0.10) 0%, transparent 38%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
  }

  html[data-theme="dark"] body {
    background:
      radial-gradient(circle at 12% 0%, rgba(232, 168, 206, 0.10) 0%, transparent 38%),
      radial-gradient(circle at 88% 8%, rgba(199, 184, 237, 0.09) 0%, transparent 36%),
      radial-gradient(circle at 8% 92%, rgba(232, 168, 206, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 95% 85%, rgba(168, 203, 169, 0.06) 0%, transparent 38%),
      var(--bg);
    background-attachment: fixed;
  }

  header, main, .modal-backdrop { position: relative; z-index: 1; }

  header {
    padding: 56px 5vw 0;
    max-width: 1400px;
    margin: 0 auto;
  }

  .brand-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 34px;
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex-shrink: 0; }

  .brand-text h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(30px, 4vw, 40px);
    margin: 0;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .brand-text h1 em { font-style: italic; font-weight: 500; color: var(--pink); }

  .brand-text .tagline {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 6px 0 0;
    font-weight: 600;
  }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  .search-wrap { position: relative; flex: 1 1 240px; max-width: 320px; }

  .search-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.5;
  }

  #search {
    width: 100%;
    padding: 11px 16px 11px 42px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--card);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #search::placeholder { color: #B7AFC0; font-weight: 500; }

  #search:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 4px rgba(217, 143, 184, 0.16);
  }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    position: fixed;
    top: 22px;
    right: 24px;
    width: 56px;
    height: 30px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--card);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    display: flex;
    align-items: center;
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
    box-shadow: var(--card-shadow);
    z-index: 100;
  }

  .theme-toggle:hover { border-color: var(--pink); transform: translateY(-2px); }

  .theme-toggle .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: transform 0.35s cubic-bezier(.34, 1.56, .64, 1), background 0.3s ease;
    box-shadow: 0 2px 6px -2px rgba(153, 68, 116, 0.5);
  }

  html[data-theme="dark"] .theme-toggle .knob {
    transform: translateX(26px);
    background: linear-gradient(135deg, var(--lavender), #7A6BAF);
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 44px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }

  .stat-card:hover { box-shadow: var(--card-shadow); transform: translateY(-2px); }

  .stat-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .stat-icon.pink { background: var(--blush); }
  .stat-icon.lav { background: #EFE9F8; }
  .stat-icon.sage { background: #EAF1EB; }
  .stat-icon.clay { background: var(--blush-deep); }

  .stat-card .num {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1;
    display: block;
  }

  .stat-card .label {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 700;
    margin-top: 3px;
    display: block;
  }

  .spotlight { max-width: 1400px; margin: 0 auto; padding: 0 5vw; }

  .section-label {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    margin: 0 0 16px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .section-label .count {
    font-family: 'Nunito', sans-serif;
    font-style: normal;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--blush);
    padding: 2px 9px;
    border-radius: 999px;
  }

  .spotlight-row {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 44px;
    scroll-snap-type: x proximity;
  }

  .spotlight-row::-webkit-scrollbar { height: 6px; }
  .spotlight-row::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .spotlight-card {
    flex: 0 0 auto;
    width: 220px;
    scroll-snap-align: start;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    display: flex;
    gap: 14px;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(.22, 1, .36, 1), box-shadow 0.22s;
  }

  .spotlight-card:hover { transform: translateY(-4px); box-shadow: var(--card-shadow-hover); }

  .spotlight-cover {
    width: 56px;
    aspect-ratio: 2/3;
    border-radius: 5px 7px 7px 5px;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -4px rgba(62,58,70,0.25);
    position: relative;
    overflow: hidden;
  }

  .spotlight-info { min-width: 0; display: flex; flex-direction: column; justify-content: center; }

  .spotlight-info .title {
    font-size: 13.5px;
    font-weight: 800;
    margin: 0 0 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .spotlight-info .author {
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shelf-tabs { display: flex; gap: 8px; flex-wrap: wrap; }

  .shelf-tab {
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .shelf-tab:hover { border-color: var(--pink); color: var(--ink); }

  .shelf-tab.active { background: var(--pink-deep); border-color: var(--pink-deep); color: #fff; }

  main { max-width: 1400px; margin: 0 auto; padding: 0 5vw 100px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 36px 24px;
  }

  .book { cursor: pointer; display: flex; flex-direction: column; gap: 10px; position: relative; }

  .book:focus-visible .cover { outline: 3px solid var(--pink); outline-offset: 3px; }

  .cover-wrap { position: relative; }

  .cover {
    aspect-ratio: 2 / 3;
    border-radius: 6px 9px 9px 6px;
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
    position: relative;
    transition: transform 0.3s cubic-bezier(.22, 1, .36, 1), box-shadow 0.3s;
    overflow: hidden;
  }

  .cover::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 10px;
    background: linear-gradient(to right, rgba(255,255,255,0.35), transparent);
  }

  .cover::after {
    content: '';
    position: absolute;
    right: 0; top: 3px; bottom: 3px;
    width: 4px;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.55) 0px,
      rgba(255,255,255,0.55) 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    border-radius: 0 3px 3px 0;
  }

  .cover-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    line-height: 1.25;
    color: rgba(0,0,0,0.72);
  }

  .ground-shadow {
    position: absolute;
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);
    width: 70%;
    height: 10px;
    background: radial-gradient(ellipse at center, rgba(62,58,70,0.18) 0%, transparent 72%);
    border-radius: 50%;
    transition: transform 0.3s cubic-bezier(.22, 1, .36, 1), opacity 0.3s;
    z-index: -1;
  }

  .book:hover .cover, .book:focus-visible .cover {
    transform: translateY(-9px);
    box-shadow: var(--card-shadow-hover);
  }

  .book:hover .ground-shadow, .book:focus-visible .ground-shadow {
    transform: translateX(-50%) scaleX(1.12);
    opacity: 0.7;
  }

  .new-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--clay);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 9.5px;
    letter-spacing: 0.03em;
    padding: 4px 9px;
    border-radius: 999px;
    box-shadow: 0 4px 10px -3px rgba(214, 154, 120, 0.55);
    z-index: 2;
    animation: badge-pop 0.4s cubic-bezier(.34, 1.56, .64, 1) backwards;
  }

  .fav-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.88);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    transition: transform 0.18s cubic-bezier(.34, 1.56, .64, 1), background 0.18s;
    box-shadow: 0 3px 8px -3px rgba(62,58,70,0.3);
  }

  .fav-btn:hover { transform: scale(1.12); }

  .fav-btn svg { width: 14px; height: 14px; transition: fill 0.18s, stroke 0.18s; }

  .fav-btn.active { background: var(--pink-deep); }
  .fav-btn.active svg { fill: #fff; stroke: #fff; }

  .meta { padding: 0 2px; }

  .meta .title { font-size: 13.5px; font-weight: 800; line-height: 1.3; margin: 0; }

  .meta .author { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin: 3px 0 0; }

  .meta .tag-line {
    font-size: 11px;
    color: var(--pink-deep);
    font-weight: 700;
    margin: 5px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    grid-column: 1/-1;
  }

  .empty-state .empty-icon { font-size: 30px; display: block; margin-bottom: 10px; }

  .add-book .cover {
    background: var(--card);
    border: 1.5px dashed var(--line);
    box-shadow: none;
    color: var(--ink-soft);
    flex-direction: column;
    gap: 8px;
    transition: transform 0.3s cubic-bezier(.22, 1, .36, 1), border-color 0.2s, color 0.2s;
  }

  .add-book .cover::before, .add-book .cover::after { display: none; }

  .add-book:hover .cover {
    border-color: var(--pink);
    color: var(--pink-deep);
    transform: translateY(-9px);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(69, 54, 69, 0.42);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 50;
  }

  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--card);
    border-radius: 26px;
    max-width: 640px;
    width: 100%;
    padding: 0;
    position: relative;
    box-shadow: 0 40px 80px -24px rgba(153, 68, 116, 0.35);
    transform: translateY(16px) scale(0.96);
    transition: transform 0.32s cubic-bezier(.22, 1, .36, 1);
    overflow: hidden;
    border: 1px solid var(--line);
  }

  .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

  .modal-topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    padding: 22px 28px 0;
  }

  .modal-icon-btn {
    background: var(--blush);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--ink);
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.2s ease;
    flex-shrink: 0;
  }

  .modal-icon-btn:hover { background: var(--pink); color: #fff; transform: scale(1.06); }

  .modal-body {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 34px;
    padding: 18px 40px 40px;
    align-items: start;
  }

  .modal-cover-wrap { position: relative; }

  .modal-cover {
    width: 150px;
    aspect-ratio: 2/3;
    border-radius: 8px 12px 12px 8px;
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
  }

  .modal-cover .cover-title { font-size: 14px; }

  .modal-fav-btn {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px -3px rgba(62,58,70,0.3);
    transition: transform 0.18s cubic-bezier(.34, 1.56, .64, 1), background 0.18s;
  }

  .modal-fav-btn:hover { transform: scale(1.1); }
  .modal-fav-btn svg { width: 16px; height: 16px; }
  .modal-fav-btn.active { background: var(--pink-deep); }
  .modal-fav-btn.active svg { fill: #fff; stroke: #fff; }

  .modal h2 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 6px;
    line-height: 1.2;
  }

  .modal .modal-author { color: var(--ink-soft); font-weight: 700; font-size: 14px; margin: 0 0 18px; }

  .modal-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }

  .modal-tags span {
    background: var(--blush);
    color: var(--pink-deep);
    font-size: 12px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 999px;
  }

  .modal-actions { display: flex; gap: 12px; margin-top: 4px; }

  .btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 14px;
    border: none;
    padding: 13px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .btn-primary {
    background: var(--pink-deep);
    color: #fff;
    flex: 1;
    box-shadow: 0 10px 22px -10px rgba(199, 115, 163, 0.6);
  }
  .btn-primary:hover { background: #B3608F; transform: translateY(-2px); box-shadow: 0 14px 26px -10px rgba(199,115,163,0.7); }

  .btn-secondary { background: var(--blush); color: var(--ink); }
  .btn-secondary:hover { background: var(--blush-deep); }

  .edit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 14px;
    margin-bottom: 24px;
  }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field.full { grid-column: 1 / -1; }

  .field label {
    font-size: 11px;
    font-weight: 800;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field input {
    font-family: 'Nunito', sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    outline: none;
    background: #FFFBFD;
    transition: border-color 0.18s, box-shadow 0.18s;
    width: 100%;
  }

  .field input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(217, 143, 184, 0.16); }

  .field-title input { font-family: 'Fraunces', serif; font-size: 16px; }

  .fav-toggle-field { display: flex; align-items: center; }

  .fav-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1.5px solid var(--line);
    background: #FFFBFD;
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    transition: border-color 0.18s, color 0.18s, background 0.18s;
    width: 100%;
    justify-content: center;
  }

  .fav-toggle svg { width: 15px; height: 15px; transition: fill 0.18s, stroke 0.18s; }

  .fav-toggle.active {
    border-color: var(--pink);
    background: var(--blush);
    color: var(--pink-deep);
  }

  .fav-toggle.active svg { fill: var(--pink-deep); stroke: var(--pink-deep); }

  #file-input { display: none; }

  .confetti-piece {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 200;
    opacity: 1;
  }

  @keyframes confetti-pop {
    0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); opacity: 0; }
  }

  @keyframes badge-pop {
    from { transform: scale(0) rotate(-15deg); opacity: 0; }
    to { transform: scale(1) rotate(-8deg); opacity: 1; }
  }

  @media (max-width: 640px) {
    .modal-body { grid-template-columns: 1fr; }
    .modal-cover { width: 96px; }
    .edit-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 480px) {
    header { padding: 40px 5vw 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 24px 14px; }
    .spotlight { padding: 0 5vw; }
    main { padding: 0 5vw 90px; }
    .theme-toggle { top: 14px; right: 14px; }
  }

  /* ---------- Reader overlay ---------- */
  .reader-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 300;
    display: none;
    flex-direction: column;
    padding: 0;
  }

  .reader-overlay.open { display: flex; }

  .reader-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    flex-shrink: 0;
  }

  .reader-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 70%;
  }

  .reader-body {
    flex: 1;
    display: flex;
    align-items: stretch;
    position: relative;
    min-height: 0;
  }

  #reader-viewer {
    flex: 1;
    min-width: 0;
    background: #fff;
  }

  .reader-nav {
    flex-shrink: 0;
    width: 56px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .reader-nav:hover { background: var(--blush); color: var(--pink-deep); }

  .reader-hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 10px;
    margin: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }

  .reader-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-soft);
    background: #fff;
    z-index: 2;
  }

  /* ---------- Real cover image (parsed from epub) ---------- */
  .cover-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>

<div style="position:fixed; bottom:10px; right:14px; font-family:'Nunito',sans-serif; font-size:10px; font-weight:700; color:#C7A8BC; opacity:0.6; z-index:999; pointer-events:none;">v: real epub reader · 08.15</div>

<div class="reader-overlay" id="reader-overlay">

  <p class="reader-hint">use the arrow keys, or tap the sides, to turn pages</p>

<input type="file" id="file-input" accept=".epub" multiple>

<script src="https://cdnjs.cloudflare.com/ajax/libs/epubjs/0.3.93/epub.min.js"></script>
<script>
  /* ---------------------------------------------------------
     DATA LAYER
     Books uploaded via the "add a book" tile are parsed with
     epub.js, so title/author/cover come from the real file.
    No reading-progress tracking — this is a flat archive. Shelf
    state and uploaded EPUB blobs are persisted in IndexedDB.
     Books have: title, author, tags, isFavorite, and a
     fileUrl (blob URL) used to open the reader.
  --------------------------------------------------------- */

  const coverPalettes = [
    ['#EFE3ED', '#DEC7D9'],
    ['#E4E0F2', '#C9C0E4'],
    ['#FBEADA', '#F0CFA8'],
    ['#E1EAE2', '#C3D8C5'],
    ['#F3E1E7', '#E3BECC'],
    ['#E9E5F5', '#D0C6EA'],
    ['#F5E8DC', '#E4C6A6'],
    ['#E5EEE6', '#C9DBCB'],
  ];

  function paletteFor(seed) {
    let hash = 0;
    for (let i = 0; i < seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
    return coverPalettes[Math.abs(hash) % coverPalettes.length];
  }

  function renderCover(book) {
    if (book.coverUrl) return ''; // real cover image handled separately via coverInner()
    const [c1, c2] = paletteFor(book.title);
    return `background: linear-gradient(150deg, ${c1}, ${c2});`;
  }

  // Returns the inner HTML for a cover box: a real <img> if the epub had
  // an embedded cover, otherwise the gradient + title-text placeholder.
  function coverInner(book) {
    if (book.coverUrl) {
      return `<img class="cover-img" src="${book.coverUrl}" alt="" draggable="false">`;
    }
    return `<span class="cover-title">${book.title}</span>`;
  }

  const heartFilledSvg = `<svg viewBox="0 0 24 24" fill="#C773A3" stroke="#C773A3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>`;
  const heartOutlineSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="#9184A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>`;

  const confettiColors = ['#D98FB8', '#C773A3', '#B8A9D9', '#9CB89E', '#D69A78'];

  function burstConfetti(originEl) {
    burstConfettiAtRect(originEl ? originEl.getBoundingClientRect() : null);
  }

  function burstConfettiAtRect(rect) {
    const originX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    const originY = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
    const count = 20;

    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const distance = 55 + Math.random() * 85;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 18;
      const rot = (Math.random() - 0.5) * 480;
      const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];

      piece.style.left = originX + 'px';
      piece.style.top = originY + 'px';
      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.setProperty('--rot', rot + 'deg');
      piece.style.animation = `confetti-pop ${0.6 + Math.random() * 0.4}s ease-out forwards`;
      piece.style.background = color;
      if (Math.random() < 0.4) piece.style.borderRadius = '3px';

      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 1100);
    }
  }

  const sampleBooks = [
    { id: 1, title: "The House in the Cerulean Sea", author: "TJ Klune", tags: ["fantasy", "cozy"], isFavorite: true },
    { id: 2, title: "Erha / 2ha", author: "肉包不吃肉", tags: ["danmei", "xianxia"], isFavorite: true },
    { id: 3, title: "Piranesi", author: "Susanna Clarke", tags: ["fantasy"], isFavorite: false },
    { id: 4, title: "Slow Damage", author: "Mikage Sasaki", tags: ["manga"], isFavorite: true },
    { id: 5, title: "A Psalm for the Wild-Built", author: "Becky Chambers", tags: ["scifi", "cozy"], isFavorite: false },
    { id: 6, title: "Legends & Lattes", author: "Travis Baldree", tags: ["fantasy", "cozy"], isFavorite: false },
    { id: 7, title: "Divine Rivals", author: "Rebecca Ross", tags: ["fantasy", "romance"], isFavorite: false },
    { id: 8, title: "The Atlas Seven", author: "Olivie Blake", tags: ["fantasy", "dark academia"], isFavorite: false },
  ];

  const booksDbName = 'my-shelf-library';
  const booksStoreName = 'state';
  let books = [];
  let activeFilter = 'all';
  let searchTerm = '';

  function openBooksDb() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(booksDbName, 1);
      request.onupgradeneeded = () => request.result.createObjectStore(booksStoreName);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function saveBooks() {
    try {
      const db = await openBooksDb();
      await new Promise((resolve, reject) => {
        const transaction = db.transaction(booksStoreName, 'readwrite');
        transaction.objectStore(booksStoreName).put(books, 'library');
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      db.close();
    } catch (err) {
      console.warn('Could not save your shelf:', err);
    }
  }

  async function loadBooks() {
    try {
      const db = await openBooksDb();
      const storedBooks = await new Promise((resolve, reject) => {
        const request = db.transaction(booksStoreName).objectStore(booksStoreName).get('library');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      db.close();

      if (!storedBooks) {
        books = [...sampleBooks];
        await saveBooks();
        return;
      }

      books = storedBooks;
      await Promise.all(books.map(async book => {
        if (!book.fileBlob) return;
        book.fileUrl = URL.createObjectURL(book.fileBlob);
        book.coverUrl = null;
        try {
          const epub = ePub(book.fileUrl);
          const cover = await epub.coverUrl();
          if (cover) book.coverUrl = cover;
          epub.destroy();
        } catch (err) {
          console.warn('Could not restore cover:', book.title, err);
        }
      }));
    } catch (err) {
      console.warn('Could not load your shelf:', err);
      books = [...sampleBooks];
    }
  }

  const grid = document.getElementById('grid');
  const gridLabel = document.getElementById('grid-label');
  const spotlightRow = document.getElementById('spotlight-row');
  const spotlightSection = document.getElementById('spotlight-section');
  const spotlightCount = document.getElementById('spotlight-count');
  const statTotal = document.getElementById('stat-total');
  const statFavorites = document.getElementById('stat-favorites');
  const statAuthors = document.getElementById('stat-authors');
  const statTags = document.getElementById('stat-tags');

  function renderSpotlight() {
    const favorites = books.filter(b => b.isFavorite);
    spotlightCount.textContent = favorites.length;
    spotlightSection.style.display = favorites.length ? 'block' : 'none';

    spotlightRow.innerHTML = favorites.map(book => `
      <div class="spotlight-card" data-id="${book.id}">
        <div class="spotlight-cover" style="${renderCover(book)}">${book.coverUrl ? `<img class="cover-img" src="${book.coverUrl}" alt="" draggable="false" style="border-radius:5px 7px 7px 5px;">` : ''}</div>
        <div class="spotlight-info">
          <p class="title">${book.title}</p>
          <p class="author">${book.author}</p>
        </div>
      </div>
    `).join('');

    spotlightRow.querySelectorAll('.spotlight-card').forEach(el => {
      el.addEventListener('click', () => openModal(Number(el.dataset.id)));
    });
  }

  function render() {
    let list = books.filter(b => {
      const matchesFilter = activeFilter === 'all' || (activeFilter === 'favorites' && b.isFavorite);
      const matchesSearch = (b.title + ' ' + b.author).toLowerCase().includes(searchTerm.toLowerCase());
      return matchesFilter && matchesSearch;
    });

    statTotal.textContent = books.length;
    statFavorites.textContent = books.filter(b => b.isFavorite).length;
    statAuthors.textContent = new Set(books.map(b => b.author)).size;
    statTags.textContent = new Set(books.flatMap(b => b.tags)).size;

    renderSpotlight();

    const bookCards = list.map(book => `
      <div class="book" tabindex="0" data-id="${book.id}">
        <div class="cover-wrap">
          <div class="cover" style="${renderCover(book)}">
            ${book.isNew ? `<span class="new-badge">new!</span>` : ''}
            ${coverInner(book)}
          </div>
          <button class="fav-btn ${book.isFavorite ? 'active' : ''}" data-fav-id="${book.id}" title="toggle favorite">
            ${book.isFavorite ? heartFilledSvg : heartOutlineSvg}
          </button>
          <div class="ground-shadow"></div>
        </div>
        <div class="meta">
          <p class="title">${book.title}</p>
          <p class="author">${book.author}</p>
          ${book.tags.length ? `<p class="tag-line">${book.tags.join(' · ')}</p>` : ''}
        </div>
      </div>
    `).join('');

    const addTile = `
      <div class="book add-book" id="add-book-tile" tabindex="0">
        <div class="cover-wrap">
          <div class="cover">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
        </div>
        <div class="meta"><p class="title">add a book</p></div>
      </div>
    `;

    if (list.length === 0) {
      grid.innerHTML = `<div class="empty-state"><span class="empty-icon">🌙📖</span>this corner of the shelf is empty<br>try another search, or add something new!</div>` + addTile;
    } else {
      grid.innerHTML = bookCards + addTile;
    }

    document.querySelectorAll('.book:not(.add-book)').forEach(el => {
      el.addEventListener('click', () => openModal(Number(el.dataset.id)));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(Number(el.dataset.id)); });
    });

    document.querySelectorAll('.fav-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const book = books.find(b => b.id === Number(btn.dataset.favId));
        if (!book) return;
        book.isFavorite = !book.isFavorite;
        saveBooks();
        render();
      });
    });

    document.getElementById('add-book-tile').addEventListener('click', () => {
      document.getElementById('file-input').click();
    });
  }

  /* ---------------------------------------------------------
     MODAL
  --------------------------------------------------------- */
  const backdrop = document.getElementById('modal-backdrop');
  let currentBookId = null;

  function fillViewMode(book) {
    document.getElementById('modal-title').textContent = book.title;
    document.getElementById('modal-author').textContent = book.author;
    document.getElementById('modal-cover').style.cssText = renderCover(book) + 'position:relative;overflow:hidden;';
    document.getElementById('modal-cover').innerHTML = coverInner(book);
    document.getElementById('modal-tags').innerHTML = book.tags.map(t => `<span>${t}</span>`).join('');

    const favBtn = document.getElementById('modal-fav-btn');
    favBtn.classList.toggle('active', book.isFavorite);
    favBtn.innerHTML = book.isFavorite ? heartFilledSvg : `<svg viewBox="0 0 24 24" fill="none" stroke="#C773A3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>`;
  }

  function fillEditMode(book) {
    document.getElementById('edit-title').value = book.title;
    document.getElementById('edit-author').value = book.author;
    document.getElementById('edit-tags').value = book.tags.join(', ');
    document.getElementById('edit-cover-preview').style.cssText = renderCover(book) + 'position:relative;overflow:hidden;';
    document.getElementById('edit-cover-preview').innerHTML = coverInner(book);
    setEditFavState(book.isFavorite);
  }

  function setEditFavState(isFav) {
    const toggle = document.getElementById('edit-fav-toggle');
    const label = document.getElementById('edit-fav-label');
    toggle.classList.toggle('active', isFav);
    toggle.dataset.fav = isFav ? 'true' : 'false';
    label.textContent = isFav ? 'favorite' : 'not a favorite';
    toggle.querySelector('svg').outerHTML = isFav
      ? `<svg viewBox="0 0 24 24" fill="#C773A3" stroke="#C773A3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="#9184A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>`;
  }

  function setEditing(isEditing) {
    document.getElementById('view-mode').style.display = isEditing ? 'none' : 'grid';
    document.getElementById('edit-mode').style.display = isEditing ? 'grid' : 'none';
    document.getElementById('modal-edit-toggle').style.display = isEditing ? 'none' : 'flex';
  }

  function openModal(id) {
    const book = books.find(b => b.id === id);
    if (!book) return;
    currentBookId = id;
    fillViewMode(book);
    fillEditMode(book);
    setEditing(false);
    backdrop.classList.add('open');
    if (book.isNew) {
      book.isNew = false;
      render();
    }
  }

  function closeModal() {
    backdrop.classList.remove('open');
    setEditing(false);
    currentBookId = null;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('modal-edit-toggle').addEventListener('click', () => setEditing(true));
  document.getElementById('edit-cancel-btn').addEventListener('click', () => {
    const book = books.find(b => b.id === currentBookId);
    fillEditMode(book);
    setEditing(false);
  });

  document.getElementById('modal-fav-btn').addEventListener('click', () => {
    const book = books.find(b => b.id === currentBookId);
    if (!book) return;
    book.isFavorite = !book.isFavorite;
    fillViewMode(book);
    fillEditMode(book);
    saveBooks();
    render();
  });

  document.getElementById('edit-fav-toggle').addEventListener('click', () => {
    const toggle = document.getElementById('edit-fav-toggle');
    const nowFav = toggle.dataset.fav !== 'true';
    setEditFavState(nowFav);
  });

  document.getElementById('edit-save-btn').addEventListener('click', (e) => {
    const book = books.find(b => b.id === currentBookId);
    if (!book) return;
    const newTitle = document.getElementById('edit-title').value.trim();
    book.title = newTitle || book.title;
    book.author = document.getElementById('edit-author').value.trim() || 'unknown author';
    book.tags = document.getElementById('edit-tags').value
      .split(',').map(t => t.trim()).filter(Boolean);
    book.isFavorite = document.getElementById('edit-fav-toggle').dataset.fav === 'true';
    book.isNew = false;

    fillViewMode(book);
    setEditing(false);
    burstConfetti(e.currentTarget);
    saveBooks();
    render();
  });

  document.getElementById('modal-remove-btn').addEventListener('click', () => {
    books = books.filter(b => b.id !== currentBookId);
    closeModal();
    saveBooks();
    render();
  });

  document.getElementById('modal-open-btn').addEventListener('click', () => {
    const book = books.find(b => b.id === currentBookId);
    if (!book) return;
    openReader(book);
  });

  /* ---------------------------------------------------------
     READER — renders the actual epub file in a full-screen
     overlay using epub.js. Only works for books uploaded
     through the "add a book" tile (they have a fileUrl); the
     original sample books are just placeholders and have none.
  --------------------------------------------------------- */
  const readerOverlay = document.getElementById('reader-overlay');
  const readerViewer = document.getElementById('reader-viewer');
  const readerTitle = document.getElementById('reader-title');
  let currentEpubBook = null;
  let currentRendition = null;

  function openReader(book) {
    if (!book.fileUrl) {
      alert("This one's just a placeholder without a real file attached, so there's nothing to open yet. Try uploading an actual .epub through the \"add a book\" tile!");
      return;
    }

    readerTitle.textContent = book.title;
    readerViewer.innerHTML = '<div class="reader-loading">opening your book...</div>';
    readerOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    currentEpubBook = ePub(book.fileUrl);
    currentRendition = currentEpubBook.renderTo('reader-viewer', {
      width: '100%',
      height: '100%',
      spread: 'auto'
    });

    currentRendition.display().then(() => {
      const loading = readerViewer.querySelector('.reader-loading');
      if (loading) loading.remove();
    }).catch(err => {
      readerViewer.innerHTML = '<div class="reader-loading">hmm, this file wouldn\'t open — it may not be a valid epub.</div>';
      console.error('epub render error:', err);
    });
  }

  function closeReader() {
    readerOverlay.classList.remove('open');
    document.body.style.overflow = '';
    if (currentEpubBook) {
      currentEpubBook.destroy();
      currentEpubBook = null;
      currentRendition = null;
    }
    readerViewer.innerHTML = '';
  }

  document.getElementById('reader-close').addEventListener('click', closeReader);
  document.getElementById('reader-prev').addEventListener('click', () => currentRendition && currentRendition.prev());
  document.getElementById('reader-next').addEventListener('click', () => currentRendition && currentRendition.next());

  document.addEventListener('keydown', e => {
    if (!readerOverlay.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') currentRendition && currentRendition.prev();
    if (e.key === 'ArrowRight') currentRendition && currentRendition.next();
    if (e.key === 'Escape') closeReader();
  });

  /* ---------------------------------------------------------
     THEME TOGGLE
    Defaults to the visitor's system preference (light/dark),
    and can be flipped manually with the header switch. The
    manual choice is persisted locally.
  --------------------------------------------------------- */
  const themeToggle = document.getElementById('theme-toggle');
  const themeKnob = themeToggle.querySelector('.knob');

  function applyTheme(isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    themeKnob.textContent = isDark ? '🌙' : '☀️';
  }

  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const savedTheme = localStorage.getItem('my-shelf-theme');
  applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    applyTheme(!isDark);
    localStorage.setItem('my-shelf-theme', isDark ? 'light' : 'dark');
    burstConfetti(themeToggle);
  });

  /* ---------------------------------------------------------
     SEARCH + FILTER TABS
  --------------------------------------------------------- */
  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value;
    render();
  });

  document.getElementById('shelf-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.shelf-tab');
    if (!btn) return;
    document.querySelectorAll('.shelf-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    gridLabel.childNodes[0].textContent = (activeFilter === 'all' ? 'your shelf' : 'favorites') + ' ';
    render();
  });

  /* ---------------------------------------------------------
     FILE INPUT — parses real epub files with epub.js:
     pulls title, author, and embedded cover image, and keeps
     a blob URL of the file so the reader can open it later.
     Everything happens client-side in the browser; nothing is
     uploaded anywhere.
  --------------------------------------------------------- */
  async function parseEpubFile(file) {
    const fileUrl = URL.createObjectURL(file);
    const fallbackTitle = file.name.replace(/\.epub$/i, '');

    const entry = {
      id: Date.now() + Math.random(),
      title: fallbackTitle,
      author: "unknown author",
      tags: ["new"],
      isFavorite: false,
      isNew: true,
      fileUrl,
      fileBlob: file,
      coverUrl: null
    };

    try {
      const book = ePub(fileUrl);
      const metadata = await book.loaded.metadata;
      if (metadata.title) entry.title = metadata.title;
      if (metadata.creator) entry.author = metadata.creator;

      const cover = await book.coverUrl();
      if (cover) entry.coverUrl = cover;
    } catch (err) {
      // Not a valid epub, or missing metadata/cover — the entry still
      // works fine with the filename-based fallback title above.
      console.warn('Could not fully parse epub:', file.name, err);
    }

    return entry;
  }

  document.getElementById('file-input').addEventListener('change', async e => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    const addTile = document.getElementById('add-book-tile');
    const rect = addTile ? addTile.getBoundingClientRect() : null;

    const newEntries = await Promise.all(files.map(parseEpubFile));
    books.push(...newEntries);

    saveBooks();
    render();
    burstConfettiAtRect(rect);
    e.target.value = '';
  });

  loadBooks().then(render);
</script>

</body>
</html>
