<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F9;
    --ink: #453645;
    --ink-soft: #8B7FA3;
    --pink: #D4A5C4;
    --lavender: #B8A9D9;
    --blush: #F3DFE8;
    --blush-deep: #EACBDB;
    --card-shadow: 0 10px 25px -12px rgba(139, 127, 163, 0.35);
    --card-shadow-hover: 0 18px 34px -14px rgba(212, 165, 196, 0.5);
  }

- { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
margin: 0;
background: var(–bg);
background-image:
radial-gradient(circle at 8% 12%, rgba(184, 169, 217, 0.10) 0%, transparent 45%),
radial-gradient(circle at 92% 85%, rgba(212, 165, 196, 0.12) 0%, transparent 45%);
color: var(–ink);
font-family: ‘Quicksand’, sans-serif;
min-height: 100vh;
}

/* ––––– Header ––––– */
header {
padding: 56px 6vw 28px;
display: flex;
flex-direction: column;
gap: 22px;
}

.brand-row {
display: flex;
align-items: baseline;
justify-content: space-between;
flex-wrap: wrap;
gap: 16px;
}

.brand {
display: flex;
align-items: center;
gap: 10px;
}

.brand-mark {
width: 34px;
height: 34px;
flex-shrink: 0;
}

.brand h1 {
font-family: ‘Fraunces’, serif;
font-weight: 600;
font-size: clamp(28px, 4vw, 38px);
margin: 0;
letter-spacing: -0.01em;
}

.brand h1 em {
font-style: italic;
font-weight: 500;
color: var(–pink);
}

.tagline {
font-size: 13px;
color: var(–ink-soft);
letter-spacing: 0.04em;
margin: 2px 0 0 44px;
}

.stats {
font-size: 13px;
color: var(–ink-soft);
display: flex;
gap: 18px;
}

.stats strong {
color: var(–ink);
font-weight: 700;
}

/* ––––– Search + Filters ––––– */
.controls {
display: flex;
gap: 12px;
flex-wrap: wrap;
align-items: center;
}

.search-wrap {
position: relative;
flex: 1 1 260px;
max-width: 420px;
}

.search-wrap svg {
position: absolute;
left: 16px;
top: 50%;
transform: translateY(-50%);
opacity: 0.5;
}

#search {
width: 100%;
padding: 12px 16px 12px 42px;
border-radius: 999px;
border: 1.5px solid var(–blush-deep);
background: #fff;
font-family: ‘Quicksand’, sans-serif;
font-size: 14px;
color: var(–ink);
outline: none;
transition: border-color 0.2s, box-shadow 0.2s;
}

#search::placeholder { color: #C6B9CC; }

#search:focus {
border-color: var(–pink);
box-shadow: 0 0 0 4px rgba(212, 165, 196, 0.18);
}

.shelf-tabs {
display: flex;
gap: 8px;
flex-wrap: wrap;
}

.shelf-tab {
border: 1.5px solid var(–blush-deep);
background: #fff;
color: var(–ink-soft);
font-family: ‘Quicksand’, sans-serif;
font-weight: 600;
font-size: 13px;
padding: 9px 18px;
border-radius: 999px;
cursor: pointer;
transition: all 0.18s ease;
}

.shelf-tab:hover {
border-color: var(–pink);
color: var(–ink);
}

.shelf-tab.active {
background: var(–ink);
border-color: var(–ink);
color: #fff;
}

/* ––––– Shelf grid ––––– */
main {
padding: 12px 6vw 100px;
}

.shelf-section {
margin-bottom: 52px;
}

.shelf-label {
font-family: ‘Fraunces’, serif;
font-style: italic;
font-size: 15px;
color: var(–ink-soft);
margin: 0 0 18px 4px;
display: flex;
align-items: center;
gap: 10px;
}

.shelf-label::after {
content: ‘’;
flex: 1;
height: 1px;
background: linear-gradient(to right, var(–blush-deep), transparent);
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
gap: 30px 22px;
}

/* ––––– Ambient decoration ––––– */
.decor-layer {
position: fixed;
inset: 0;
pointer-events: none;
overflow: hidden;
z-index: 0;
}

.decor-item {
position: absolute;
opacity: 0.55;
animation: drift 14s ease-in-out infinite;
}

@keyframes drift {
0%   { transform: translateY(0) rotate(0deg); }
50%  { transform: translateY(-22px) rotate(8deg); }
100% { transform: translateY(0) rotate(0deg); }
}

@keyframes twinkle {
0%, 100% { opacity: 0.25; transform: scale(0.85); }
50% { opacity: 0.8; transform: scale(1.1); }
}

.sparkle {
animation: twinkle 3.4s ease-in-out infinite;
}

header, main, .modal-backdrop { position: relative; z-index: 1; }

@keyframes wiggle {
0%, 100% { transform: rotate(-3deg); }
50% { transform: rotate(3deg); }
}

.brand-mark {
animation: wiggle 4s ease-in-out infinite;
transform-origin: center;
}

@keyframes float-in {
from { opacity: 0; transform: translateY(16px) scale(0.94); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes gentle-sway {
0%, 100% { transform: rotate(-0.6deg); }
50% { transform: rotate(0.6deg); }
}

.book {
cursor: pointer;
display: flex;
flex-direction: column;
gap: 10px;
position: relative;
animation: float-in 0.5s cubic-bezier(.2,.8,.2,1) backwards;
}

.book .cover-sway {
animation: gentle-sway 5s ease-in-out infinite;
transform-origin: bottom center;
}

.book:hover .cover-sway, .book:focus-visible .cover-sway {
animation-play-state: paused;
}

.book:focus-visible .cover {
outline: 3px solid var(–pink);
outline-offset: 3px;
}

.cover-sway { position: relative; z-index: 1; }

.cover {
aspect-ratio: 2 / 3;
border-radius: 6px 9px 9px 6px;
box-shadow: var(–card-shadow);
display: flex;
align-items: center;
justify-content: center;
text-align: center;
padding: 18px;
position: relative;
transition: transform 0.38s cubic-bezier(.34, 1.56, .64, 1), box-shadow 0.3s;
overflow: hidden;
}

.cover::before {
/* spine highlight */
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 10px;
background: linear-gradient(to right, rgba(255,255,255,0.35), transparent);
}

.cover::after {
/* page edge on the right */
content: ‘’;
position: absolute;
right: 0; top: 3px; bottom: 3px;
width: 4px;
background: repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.55) 0px,
rgba(255,255,255,0.55) 2px,
rgba(0,0,0,0.04) 2px,
rgba(0,0,0,0.04) 4px
);
border-radius: 0 3px 3px 0;
}

.cover-title {
font-family: ‘Fraunces’, serif;
font-weight: 600;
font-size: 15px;
line-height: 1.25;
color: rgba(0,0,0,0.72);
}

.book:hover .cover, .book:focus-visible .cover {
transform: translateY(-10px);
box-shadow: var(–card-shadow-hover);
}

.ground-shadow {
position: absolute;
left: 50%;
bottom: -6px;
transform: translateX(-50%);
width: 70%;
height: 10px;
background: radial-gradient(ellipse at center, rgba(139,127,163,0.28) 0%, transparent 72%);
border-radius: 50%;
transition: transform 0.38s cubic-bezier(.34, 1.56, .64, 1), opacity 0.3s;
z-index: -1;
}

.book:hover .ground-shadow, .book:focus-visible .ground-shadow {
transform: translateX(-50%) scaleX(1.15);
opacity: 0.6;
}

.progress-ring {
position: absolute;
top: 10px;
right: 10px;
width: 22px;
height: 22px;
}

.meta {
padding: 0 2px;
}

.meta .title {
font-size: 13.5px;
font-weight: 700;
line-height: 1.3;
margin: 0;
}

.meta .author {
font-size: 12px;
color: var(–ink-soft);
margin: 3px 0 0;
}

.progress-bar {
margin-top: 6px;
height: 4px;
border-radius: 2px;
background: var(–blush);
overflow: hidden;
}

.progress-bar > span {
display: block;
height: 100%;
background: linear-gradient(to right, var(–lavender), var(–pink));
border-radius: 2px;
}

.empty-state {
text-align: center;
padding: 60px 20px;
color: var(–ink-soft);
font-family: ‘Fraunces’, serif;
font-style: italic;
font-size: 16px;
}

.empty-state .empty-icon {
font-size: 32px;
display: block;
margin-bottom: 10px;
animation: float-in 0.5s ease, drift 3s ease-in-out infinite 0.5s;
}

@keyframes heart-beat {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.25); }
}

.stats .heart {
display: inline-block;
animation: heart-beat 1.6s ease-in-out infinite;
}

/* ––––– Upload tile ––––– */
.add-book .cover {
background: #fff;
border: 1.5px dashed var(–blush-deep);
box-shadow: none;
color: var(–ink-soft);
flex-direction: column;
gap: 8px;
transition: transform 0.38s cubic-bezier(.34, 1.56, .64, 1), border-color 0.2s, color 0.2s;
}

.add-book .cover::before, .add-book .cover::after { display: none; }
.add-book .cover svg { transition: transform 0.3s cubic-bezier(.34, 1.56, .64, 1); }

.add-book:hover .cover {
border-color: var(–pink);
color: var(–pink);
transform: translateY(-10px);
}

.add-book:hover .cover svg {
transform: rotate(90deg) scale(1.15);
}

.add-book .meta .title { color: var(–ink-soft); font-weight: 600; }

/* ––––– Reader modal ––––– */
.modal-backdrop {
position: fixed;
inset: 0;
background: rgba(69, 54, 69, 0.35);
backdrop-filter: blur(3px);
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
opacity: 0;
pointer-events: none;
transition: opacity 0.25s ease;
z-index: 50;
}

.modal-backdrop.open {
opacity: 1;
pointer-events: auto;
}

.modal {
background: #fff;
border-radius: 26px;
max-width: 440px;
width: 100%;
padding: 34px 30px 28px;
position: relative;
box-shadow: 0 30px 60px -20px rgba(69, 54, 69, 0.35);
transform: translateY(18px) scale(0.92);
transition: transform 0.4s cubic-bezier(.34, 1.56, .64, 1);
}

.modal-backdrop.open .modal {
transform: translateY(0) scale(1);
}

.modal-close {
position: absolute;
top: 18px;
right: 18px;
background: var(–blush);
border: none;
width: 30px;
height: 30px;
border-radius: 50%;
cursor: pointer;
color: var(–ink);
font-size: 15px;
display: flex;
align-items: center;
justify-content: center;
}

.modal-close:hover { background: var(–pink); color: #fff; }

.modal-cover {
width: 100px;
aspect-ratio: 2/3;
border-radius: 6px 9px 9px 6px;
box-shadow: var(–card-shadow);
margin-bottom: 18px;
display: flex;
align-items: center;
justify-content: center;
padding: 12px;
text-align: center;
}

.modal-cover .cover-title { font-size: 12px; }

.modal h2 {
font-family: ‘Fraunces’, serif;
font-size: 22px;
margin: 0 0 4px;
}

.modal .modal-author {
color: var(–ink-soft);
font-size: 13.5px;
margin: 0 0 16px;
}

.modal-tags {
display: flex;
gap: 8px;
flex-wrap: wrap;
margin-bottom: 18px;
}

.modal-tags span {
background: var(–blush);
color: var(–ink);
font-size: 11.5px;
font-weight: 600;
padding: 5px 12px;
border-radius: 999px;
}

.modal-actions {
display: flex;
gap: 10px;
}

.modal-edit-toggle {
position: absolute;
top: 18px;
right: 60px;
background: var(–blush);
border: none;
width: 30px;
height: 30px;
border-radius: 50%;
cursor: pointer;
color: var(–ink);
font-size: 13px;
display: flex;
align-items: center;
justify-content: center;
transition: transform 0.2s ease, background 0.2s ease;
}

.modal-edit-toggle:hover {
background: var(–pink);
color: #fff;
transform: rotate(-8deg) scale(1.06);
}

.field {
margin-bottom: 14px;
}

.field label {
display: block;
font-size: 11.5px;
font-weight: 700;
color: var(–ink-soft);
text-transform: uppercase;
letter-spacing: 0.05em;
margin-bottom: 5px;
}

.field input {
width: 100%;
font-family: ‘Quicksand’, sans-serif;
font-size: 14px;
font-weight: 600;
color: var(–ink);
border: 1.5px solid var(–blush-deep);
border-radius: 12px;
padding: 9px 12px;
outline: none;
background: #fffafc;
transition: border-color 0.18s, box-shadow 0.18s;
}

.field input:focus {
border-color: var(–pink);
box-shadow: 0 0 0 4px rgba(212, 165, 196, 0.16);
}

.field-title input {
font-family: ‘Fraunces’, serif;
font-size: 18px;
}

.field-status select {
width: 100%;
font-family: ‘Quicksand’, sans-serif;
font-size: 13.5px;
font-weight: 600;
color: var(–ink);
border: 1.5px solid var(–blush-deep);
border-radius: 12px;
padding: 9px 12px;
background: #fffafc;
outline: none;
}

.btn {
font-family: ‘Quicksand’, sans-serif;
font-weight: 700;
font-size: 13.5px;
border: none;
padding: 12px 20px;
border-radius: 999px;
cursor: pointer;
transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-primary {
background: linear-gradient(135deg, var(–lavender), var(–pink));
color: #fff;
flex: 1;
}

.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(212,165,196,0.6); }

.btn-secondary {
background: var(–blush);
color: var(–ink);
}

.btn-secondary:hover { background: var(–blush-deep); }

#file-input { display: none; }

/* ––––– Confetti burst ––––– */
.confetti-piece {
position: fixed;
top: 50%;
left: 50%;
width: 8px;
height: 8px;
border-radius: 50%;
pointer-events: none;
z-index: 200;
opacity: 1;
}

@keyframes confetti-pop {
0% {
transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
opacity: 1;
}
70% { opacity: 1; }
100% {
transform: translate(var(–tx), var(–ty)) scale(1) rotate(var(–rot));
opacity: 0;
}
}

/* ––––– New book badge ––––– */
.new-badge {
position: absolute;
top: -8px;
right: -8px;
background: linear-gradient(135deg, var(–lavender), var(–pink));
color: #fff;
font-family: ‘Quicksand’, sans-serif;
font-weight: 700;
font-size: 9.5px;
letter-spacing: 0.04em;
padding: 4px 9px;
border-radius: 999px;
box-shadow: 0 4px 10px -3px rgba(212, 165, 196, 0.6);
z-index: 2;
animation: badge-pop 0.4s cubic-bezier(.34, 1.56, .64, 1) backwards;
}

@keyframes badge-pop {
from { transform: scale(0) rotate(-15deg); opacity: 0; }
to { transform: scale(1) rotate(-8deg); opacity: 1; }
}

@media (max-width: 480px) {
header { padding: 40px 5vw 20px; }
.grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 22px 14px; }
}
</style>

<script>
  /* ---------------------------------------------------------
     DATA LAYER
     For now, books are placeholder entries with generated
     "covers" (gradient + title) since no real epub files are
     wired in yet. Swap `sampleBooks` for real parsed epub

  const coverPalettes = [
    ['#F3DFE8', '#E4C9DD'],
    ['#D9D3EF', '#C3B8E0'],
    ['#FCE9D8', '#F5D3B0'],
    ['#DDEAE0', '#BFDDC7'],
    ['#F6DCE1', '#E9B8C6'],
    ['#E3E0F5', '#CBC4EA'],
  ];

  function paletteFor(seed) {
    let hash = 0;
    for (let i = 0; i < seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
    return coverPalettes[Math.abs(hash) % coverPalettes.length];
  }

  const confettiColors = ['#D4A5C4', '#B8A9D9', '#F0C6DA', '#EACBDB', '#C3B8E0', '#FCE9D8'];

  function burstConfetti(originEl) {
    const rect = originEl ? originEl.getBoundingClientRect() : null;
    burstConfettiAtRect(rect);
  }

  function burstConfettiAtRect(rect) {
    const originX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    const originY = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
    const count = 22;

    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const distance = 60 + Math.random() * 90;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 20; // slight upward bias
      const rot = (Math.random() - 0.5) * 540;
      const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      const isHeart = Math.random() < 0.25;

      piece.style.left = originX + 'px';
      piece.style.top = originY + 'px';
      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.setProperty('--rot', rot + 'deg');
      piece.style.animation = `confetti-pop ${0.6 + Math.random() * 0.4}s ease-out forwards`;

      if (isHeart) {
        piece.style.background = 'transparent';
        piece.style.fontSize = '12px';
        piece.style.width = 'auto';
        piece.style.height = 'auto';
        piece.textContent = '💕';
      } else {
        piece.style.background = color;
        if (Math.random() < 0.4) piece.style.borderRadius = '3px'; // mix circles + little squares
      }

      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 1100);
    }
  }

  const sampleBooks = [
    { id: 1, title: "The House in the Cerulean Sea", author: "TJ Klune", status: "reading", progress: 62, tags: ["fantasy", "cozy"] },
    { id: 2, title: "Erha / 2ha", author: "肉包不吃肉", status: "reading", progress: 34, tags: ["danmei", "xianxia"] },
    { id: 3, title: "Piranesi", author: "Susanna Clarke", status: "unread", progress: 0, tags: ["fantasy"] },
    { id: 4, title: "Slow Damage", author: "Mikage Sasaki", status: "finished", progress: 100, tags: ["manga"] },
    { id: 5, title: "A Psalm for the Wild-Built", author: "Becky Chambers", status: "unread", progress: 0, tags: ["scifi", "cozy"] },
    { id: 6, title: "Legends & Lattes", author: "Travis Baldree", status: "finished", progress: 100, tags: ["fantasy", "cozy"] },
  ];

  let books = [...sampleBooks];
  let activeFilter = 'all';
  let searchTerm = '';

  const grid = document.getElementById('grid');
  const gridLabel = document.getElementById('grid-label');
  const statTotal = document.getElementById('stat-total');
  const statReading = document.getElementById('stat-reading');

  function renderCover(book) {
    const [c1, c2] = paletteFor(book.title);
    return `background: linear-gradient(150deg, ${c1}, ${c2});`;
  }

  function render() {
    let list = books.filter(b => {
      const matchesFilter = activeFilter === 'all' || b.status === activeFilter;
      const matchesSearch = (b.title + ' ' + b.author).toLowerCase().includes(searchTerm.toLowerCase());
      return matchesFilter && matchesSearch;
    });

    statTotal.textContent = books.length;
    statReading.textContent = books.filter(b => b.status === 'reading').length;

    if (list.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><span class="empty-icon">🌙📖</span>this corner of the shelf is empty<br>try another search, or add something new!</div>`;
      return;
    }

    grid.innerHTML = list.map((book, i) => `
      <div class="book" tabindex="0" data-id="${book.id}" style="animation-delay:${i * 0.05}s">
        <div class="cover-sway" style="animation-delay:${(i % 5) * 0.4}s">
          <div class="cover" style="${renderCover(book)}">
            ${book.isNew ? `<span class="new-badge">new!</span>` : ''}
            <span class="cover-title">${book.title}</span>
            <div class="ground-shadow"></div>
          </div>
        </div>
        <div class="meta">
          <p class="title">${book.title}</p>
          <p class="author">${book.author}</p>
          ${book.progress > 0 && book.progress < 100 ? `
            <div class="progress-bar"><span style="width:${book.progress}%"></span></div>
          ` : ''}
        </div>
      </div>
    `).join('') + `
      <div class="book add-book" id="add-book-tile" tabindex="0">
        <div class="cover">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <div class="meta"><p class="title">add a book</p></div>
      </div>
    `;

    document.querySelectorAll('.book:not(.add-book)').forEach(el => {
      el.addEventListener('click', () => openModal(Number(el.dataset.id)));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(Number(el.dataset.id)); });
    });

    document.getElementById('add-book-tile').addEventListener('click', () => {
      document.getElementById('file-input').click();
    });
  }

  /* ---------------------------------------------------------
     MODAL
  --------------------------------------------------------- */
  const backdrop = document.getElementById('modal-backdrop');
  let currentBookId = null;

  function fillViewMode(book) {
    document.getElementById('modal-title').textContent = book.title;
    document.getElementById('modal-author').textContent = book.author;
    document.getElementById('modal-cover').style.cssText = renderCover(book);
    document.getElementById('modal-cover').innerHTML = `<span class="cover-title">${book.title}</span>`;
    document.getElementById('modal-tags').innerHTML = book.tags.map(t => `<span>${t}</span>`).join('');
  }

  function fillEditMode(book) {
    document.getElementById('edit-title').value = book.title;
    document.getElementById('edit-author').value = book.author;
    document.getElementById('edit-tags').value = book.tags.join(', ');
    document.getElementById('edit-status').value = book.status;
  }

  function setEditing(isEditing) {
    document.getElementById('view-mode').style.display = isEditing ? 'none' : 'block';
    document.getElementById('edit-mode').style.display = isEditing ? 'block' : 'none';
    document.getElementById('modal-edit-toggle').style.display = isEditing ? 'none' : 'flex';
  }

  function openModal(id) {
    const book = books.find(b => b.id === id);
    if (!book) return;
    currentBookId = id;
    fillViewMode(book);
    fillEditMode(book);
    setEditing(false);
    backdrop.classList.add('open');
    if (book.isNew) {
      book.isNew = false;
      render(); // re-render in background so badge disappears once they've seen it
    }
  }

  function closeModal() {
    backdrop.classList.remove('open');
    setEditing(false);
    currentBookId = null;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('modal-edit-toggle').addEventListener('click', () => setEditing(true));
  document.getElementById('edit-cancel-btn').addEventListener('click', () => {
    const book = books.find(b => b.id === currentBookId);
    fillEditMode(book); // reset any unsaved changes
    setEditing(false);
  });

  document.getElementById('edit-save-btn').addEventListener('click', (e) => {
    const book = books.find(b => b.id === currentBookId);
    if (!book) return;
    const newTitle = document.getElementById('edit-title').value.trim();
    book.title = newTitle || book.title;
    book.author = document.getElementById('edit-author').value.trim() || 'unknown author';
    book.tags = document.getElementById('edit-tags').value
      .split(',').map(t => t.trim()).filter(Boolean);
    book.status = document.getElementById('edit-status').value;
    if (book.status === 'finished') book.progress = 100;
    if (book.status === 'unread') book.progress = 0;
    if (book.status === 'reading' && book.progress === 0) book.progress = 5;
    book.isNew = false;

    fillViewMode(book);
    setEditing(false);
    burstConfetti(e.currentTarget);
    render();
  });

  document.getElementById('modal-remove-btn').addEventListener('click', () => {
    books = books.filter(b => b.id !== currentBookId);
    closeModal();
    render();
  });

  document.getElementById('modal-open-btn').addEventListener('click', () => {
    // Placeholder: wire this up to an actual epub reader later
    // (e.g. epub.js) once real files are loaded.
    alert("Reader view isn't wired up yet — this is where your epub would open!");
  });

  /* ---------------------------------------------------------
     SEARCH + FILTER TABS
  --------------------------------------------------------- */
  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value;
    render();
  });

  document.getElementById('shelf-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.shelf-tab');
    if (!btn) return;
    document.querySelectorAll('.shelf-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    gridLabel.textContent = activeFilter === 'all' ? 'your shelf' : activeFilter;
    render();
  });

  /* ---------------------------------------------------------
     FILE INPUT (placeholder — just adds a stub entry for now)
     Real epub parsing (title/author/cover) can be added later
     using a library like epub.js, run client-side.
  --------------------------------------------------------- */
  document.getElementById('file-input').addEventListener('change', e => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    files.forEach(file => {
      const title = file.name.replace(/\.epub$/i, '');
      books.push({
        id: Date.now() + Math.random(),
        title,
        author: "unknown author",
        status: "unread",
        progress: 0,
        tags: ["new"],
        isNew: true
      });
    });

    const addTile = document.getElementById('add-book-tile');
    const rect = addTile ? addTile.getBoundingClientRect() : null;
    render();
    burstConfettiAtRect(rect);
    e.target.value = ''; // allow re-selecting the same file later
  });

  render();
</script>

</body>
</html>
