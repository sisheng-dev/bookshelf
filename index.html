<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF5F8;
    --ink: #453645;
    --ink-soft: #9184A0;
    --pink: #D98FB8;
    --pink-deep: #C773A3;
    --lavender: #B8A9D9;
    --sage: #9CB89E;
    --clay: #D69A78;
    --blush: #F7E0EC;
    --blush-deep: #F0C9DD;
    --card: #FFFFFF;
    --line: #F0D9E6;
    --card-shadow: 0 8px 22px -12px rgba(153, 68, 116, 0.18);
    --card-shadow-hover: 0 18px 34px -14px rgba(153, 68, 116, 0.3);
  }

- { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
margin: 0;
background:
radial-gradient(circle at 12% 0%, rgba(217, 143, 184, 0.16) 0%, transparent 38%),
radial-gradient(circle at 88% 8%, rgba(184, 169, 217, 0.14) 0%, transparent 36%),
radial-gradient(circle at 8% 92%, rgba(217, 143, 184, 0.12) 0%, transparent 40%),
radial-gradient(circle at 95% 85%, rgba(156, 184, 158, 0.10) 0%, transparent 38%),
var(–bg);
background-attachment: fixed;
color: var(–ink);
font-family: ‘Nunito’, sans-serif;
min-height: 100vh;
}

.decor-layer {
position: fixed;
inset: 0;
pointer-events: none;
overflow: hidden;
z-index: 0;
}

.decor-item { position: absolute; opacity: 0.35; }

header, main, .modal-backdrop { position: relative; z-index: 1; }

header {
padding: 56px 5vw 0;
max-width: 1400px;
margin: 0 auto;
}

.brand-row {
display: flex;
align-items: flex-end;
justify-content: space-between;
flex-wrap: wrap;
gap: 20px;
margin-bottom: 34px;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 36px; height: 36px; flex-shrink: 0; }

.brand-text h1 {
font-family: ‘Fraunces’, serif;
font-weight: 600;
font-size: clamp(30px, 4vw, 40px);
margin: 0;
letter-spacing: -0.01em;
line-height: 1;
}

.brand-text h1 em { font-style: italic; font-weight: 500; color: var(–pink); }

.brand-text .tagline {
font-size: 13px;
color: var(–ink-soft);
margin: 6px 0 0;
font-weight: 600;
}

.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.search-wrap { position: relative; flex: 1 1 240px; max-width: 320px; }

.search-wrap svg {
position: absolute;
left: 16px;
top: 50%;
transform: translateY(-50%);
opacity: 0.5;
}

#search {
width: 100%;
padding: 11px 16px 11px 42px;
border-radius: 999px;
border: 1.5px solid var(–line);
background: var(–card);
font-family: ‘Nunito’, sans-serif;
font-size: 14px;
font-weight: 600;
color: var(–ink);
outline: none;
transition: border-color 0.2s, box-shadow 0.2s;
}

#search::placeholder { color: #B7AFC0; font-weight: 500; }

#search:focus {
border-color: var(–pink);
box-shadow: 0 0 0 4px rgba(217, 143, 184, 0.16);
}

.stat-row {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
gap: 16px;
margin-bottom: 44px;
}

.stat-card {
background: var(–card);
border: 1px solid var(–line);
border-radius: 18px;
padding: 20px 22px;
display: flex;
align-items: center;
gap: 15px;
transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.stat-card:hover {
box-shadow: var(–card-shadow);
transform: translateY(-2px);
}

.stat-icon {
width: 40px;
height: 40px;
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
flex-shrink: 0;
}

.stat-icon.pink { background: var(–blush); }
.stat-icon.lav { background: #EFE9F8; }
.stat-icon.sage { background: #EAF1EB; }
.stat-icon.clay { background: var(–blush-deep); }

.stat-card .num {
font-family: ‘Fraunces’, serif;
font-weight: 600;
font-size: 22px;
line-height: 1;
display: block;
}

.stat-card .label {
font-size: 12px;
color: var(–ink-soft);
font-weight: 700;
margin-top: 3px;
display: block;
}

.spotlight { max-width: 1400px; margin: 0 auto; padding: 0 5vw; }

.section-label {
font-family: ‘Fraunces’, serif;
font-style: italic;
font-size: 16px;
color: var(–ink);
margin: 0 0 16px;
display: flex;
align-items: baseline;
gap: 10px;
}

.section-label .count {
font-family: ‘Nunito’, sans-serif;
font-style: normal;
font-size: 12px;
font-weight: 700;
color: var(–ink-soft);
background: var(–blush);
padding: 2px 9px;
border-radius: 999px;
}

.spotlight-row {
display: flex;
gap: 16px;
overflow-x: auto;
padding-bottom: 12px;
margin-bottom: 44px;
scroll-snap-type: x proximity;
}

.spotlight-row::-webkit-scrollbar { height: 6px; }
.spotlight-row::-webkit-scrollbar-thumb { background: var(–line); border-radius: 3px; }

.spotlight-card {
flex: 0 0 auto;
width: 260px;
scroll-snap-align: start;
background: var(–card);
border: 1px solid var(–line);
border-radius: 18px;
padding: 16px;
display: flex;
gap: 14px;
cursor: pointer;
transition: transform 0.22s cubic-bezier(.22, 1, .36, 1), box-shadow 0.22s;
}

.spotlight-card:hover { transform: translateY(-4px); box-shadow: var(–card-shadow-hover); }

.spotlight-cover {
width: 56px;
aspect-ratio: 2/3;
border-radius: 5px 7px 7px 5px;
flex-shrink: 0;
box-shadow: 0 4px 10px -4px rgba(62,58,70,0.25);
}

.spotlight-info { min-width: 0; display: flex; flex-direction: column; }

.spotlight-info .title {
font-size: 13.5px;
font-weight: 800;
margin: 0 0 2px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.spotlight-info .author {
font-size: 11.5px;
color: var(–ink-soft);
font-weight: 600;
margin: 0 0 10px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.spotlight-progress-track {
height: 5px;
border-radius: 3px;
background: var(–blush);
overflow: hidden;
margin-top: auto;
}

.spotlight-progress-track > span {
display: block;
height: 100%;
background: linear-gradient(to right, var(–pink), var(–pink-deep));
}

.spotlight-pct { font-size: 11px; font-weight: 800; color: var(–ink-soft); margin-top: 5px; }

.shelf-tabs { display: flex; gap: 8px; flex-wrap: wrap; }

.shelf-tab {
border: 1.5px solid var(–line);
background: var(–card);
color: var(–ink-soft);
font-family: ‘Nunito’, sans-serif;
font-weight: 700;
font-size: 13px;
padding: 9px 18px;
border-radius: 999px;
cursor: pointer;
transition: all 0.18s ease;
}

.shelf-tab:hover { border-color: var(–pink); color: var(–ink); }

.shelf-tab.active { background: var(–pink-deep); border-color: var(–pink-deep); color: #fff; }

main { max-width: 1400px; margin: 0 auto; padding: 0 5vw 100px; }

.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
gap: 36px 24px;
}

.book { cursor: pointer; display: flex; flex-direction: column; gap: 10px; position: relative; }

.book:focus-visible .cover { outline: 3px solid var(–pink); outline-offset: 3px; }

.cover-wrap { position: relative; }

.cover {
aspect-ratio: 2 / 3;
border-radius: 6px 9px 9px 6px;
box-shadow: var(–card-shadow);
display: flex;
align-items: center;
justify-content: center;
text-align: center;
padding: 18px;
position: relative;
transition: transform 0.3s cubic-bezier(.22, 1, .36, 1), box-shadow 0.3s;
overflow: hidden;
}

.cover::before {
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 10px;
background: linear-gradient(to right, rgba(255,255,255,0.35), transparent);
}

.cover::after {
content: ‘’;
position: absolute;
right: 0; top: 3px; bottom: 3px;
width: 4px;
background: repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.55) 0px,
rgba(255,255,255,0.55) 2px,
rgba(0,0,0,0.04) 2px,
rgba(0,0,0,0.04) 4px
);
border-radius: 0 3px 3px 0;
}

.cover-title {
font-family: ‘Fraunces’, serif;
font-weight: 600;
font-size: 15px;
line-height: 1.25;
color: rgba(0,0,0,0.72);
}

.ground-shadow {
position: absolute;
left: 50%;
bottom: -6px;
transform: translateX(-50%);
width: 70%;
height: 10px;
background: radial-gradient(ellipse at center, rgba(62,58,70,0.18) 0%, transparent 72%);
border-radius: 50%;
transition: transform 0.3s cubic-bezier(.22, 1, .36, 1), opacity 0.3s;
z-index: -1;
}

.book:hover .cover, .book:focus-visible .cover {
transform: translateY(-9px);
box-shadow: var(–card-shadow-hover);
}

.book:hover .ground-shadow, .book:focus-visible .ground-shadow {
transform: translateX(-50%) scaleX(1.12);
opacity: 0.7;
}

.new-badge {
position: absolute;
top: -8px;
right: -8px;
background: var(–clay);
color: #fff;
font-family: ‘Nunito’, sans-serif;
font-weight: 800;
font-size: 9.5px;
letter-spacing: 0.03em;
padding: 4px 9px;
border-radius: 999px;
box-shadow: 0 4px 10px -3px rgba(214, 154, 120, 0.55);
z-index: 2;
}

.meta { padding: 0 2px; }

.meta .title { font-size: 13.5px; font-weight: 800; line-height: 1.3; margin: 0; }

.meta .author { font-size: 12px; color: var(–ink-soft); font-weight: 600; margin: 3px 0 0; }

.progress-bar {
margin-top: 6px;
height: 4px;
border-radius: 2px;
background: var(–blush);
overflow: hidden;
}

.progress-bar > span {
display: block;
height: 100%;
background: linear-gradient(to right, var(–pink), var(–pink-deep));
border-radius: 2px;
}

.empty-state {
text-align: center;
padding: 60px 20px;
color: var(–ink-soft);
font-family: ‘Fraunces’, serif;
font-style: italic;
font-size: 16px;
grid-column: 1/-1;
}

.empty-state .empty-icon { font-size: 30px; display: block; margin-bottom: 10px; }

.add-book .cover {
background: var(–card);
border: 1.5px dashed var(–line);
box-shadow: none;
color: var(–ink-soft);
flex-direction: column;
gap: 8px;
transition: transform 0.3s cubic-bezier(.22, 1, .36, 1), border-color 0.2s, color 0.2s;
}

.add-book .cover::before, .add-book .cover::after { display: none; }

.add-book:hover .cover {
border-color: var(–pink);
color: var(–pink-deep);
transform: translateY(-9px);
}

.modal-backdrop {
position: fixed;
inset: 0;
background: rgba(69, 54, 69, 0.42);
backdrop-filter: blur(4px);
display: flex;
align-items: center;
justify-content: center;
padding: 32px;
opacity: 0;
pointer-events: none;
transition: opacity 0.25s ease;
z-index: 50;
}

.modal-backdrop.open { opacity: 1; pointer-events: auto; }

.modal {
background: var(–card);
border-radius: 26px;
max-width: 640px;
width: 100%;
padding: 0;
position: relative;
box-shadow: 0 40px 80px -24px rgba(153, 68, 116, 0.35);
transform: translateY(16px) scale(0.96);
transition: transform 0.32s cubic-bezier(.22, 1, .36, 1);
overflow: hidden;
border: 1px solid var(–line);
}

.modal-backdrop.open .modal { transform: translateY(0) scale(1); }

.modal-topbar {
display: flex;
justify-content: flex-end;
align-items: center;
gap: 10px;
padding: 22px 28px 0;
}

.modal-icon-btn {
background: var(–blush);
border: none;
width: 36px;
height: 36px;
border-radius: 50%;
cursor: pointer;
color: var(–ink);
font-size: 14px;
display: flex;
align-items: center;
justify-content: center;
transition: background 0.2s ease, transform 0.2s ease;
flex-shrink: 0;
}

.modal-icon-btn:hover { background: var(–pink); color: #fff; transform: scale(1.06); }

.modal-body {
display: grid;
grid-template-columns: 150px 1fr;
gap: 34px;
padding: 18px 40px 40px;
align-items: start;
}

.modal-cover {
width: 150px;
aspect-ratio: 2/3;
border-radius: 8px 12px 12px 8px;
box-shadow: var(–card-shadow);
display: flex;
align-items: center;
justify-content: center;
padding: 16px;
text-align: center;
}

.modal-cover .cover-title { font-size: 14px; }

.modal h2 {
font-family: ‘Fraunces’, serif;
font-size: 26px;
font-weight: 600;
margin: 0 0 6px;
line-height: 1.2;
}

.modal .modal-author { color: var(–ink-soft); font-weight: 700; font-size: 14px; margin: 0 0 18px; }

.modal-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }

.modal-tags span {
background: var(–blush);
color: var(–pink-deep);
font-size: 12px;
font-weight: 800;
padding: 6px 14px;
border-radius: 999px;
}

.modal-actions { display: flex; gap: 12px; margin-top: 4px; }

.btn {
font-family: ‘Nunito’, sans-serif;
font-weight: 800;
font-size: 14px;
border: none;
padding: 13px 22px;
border-radius: 999px;
cursor: pointer;
transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.btn-primary {
background: var(–pink-deep);
color: #fff;
flex: 1;
box-shadow: 0 10px 22px -10px rgba(199, 115, 163, 0.6);
}
.btn-primary:hover { background: #B3608F; transform: translateY(-2px); box-shadow: 0 14px 26px -10px rgba(199,115,163,0.7); }

.btn-secondary { background: var(–blush); color: var(–ink); }
.btn-secondary:hover { background: var(–blush-deep); }

.edit-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 18px 14px;
margin-bottom: 24px;
}

.field { display: flex; flex-direction: column; gap: 7px; }
.field.full { grid-column: 1 / -1; }

.field label {
font-size: 11px;
font-weight: 800;
color: var(–ink-soft);
text-transform: uppercase;
letter-spacing: 0.04em;
}

.field input, .field select {
font-family: ‘Nunito’, sans-serif;
font-size: 14.5px;
font-weight: 700;
color: var(–ink);
border: 1.5px solid var(–line);
border-radius: 12px;
padding: 11px 14px;
outline: none;
background: #FFFBFD;
transition: border-color 0.18s, box-shadow 0.18s;
width: 100%;
}

.field input:focus, .field select:focus {
border-color: var(–pink);
box-shadow: 0 0 0 4px rgba(217, 143, 184, 0.16);
}

.field-title input { font-family: ‘Fraunces’, serif; font-size: 16px; }

#file-input { display: none; }

.confetti-piece {
position: fixed;
top: 50%;
left: 50%;
width: 8px;
height: 8px;
border-radius: 50%;
pointer-events: none;
z-index: 200;
opacity: 1;
}

@keyframes confetti-pop {
0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 1; }
70% { opacity: 1; }
100% { transform: translate(var(–tx), var(–ty)) scale(1) rotate(var(–rot)); opacity: 0; }
}

@keyframes badge-pop {
from { transform: scale(0) rotate(-15deg); opacity: 0; }
to { transform: scale(1) rotate(-8deg); opacity: 1; }
}

.new-badge { animation: badge-pop 0.4s cubic-bezier(.34, 1.56, .64, 1) backwards; }

@media (max-width: 640px) {
.modal-body { grid-template-columns: 1fr; }
.modal-cover { width: 96px; }
.edit-grid { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
header { padding: 36px 5vw 0; }
.grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 24px 14px; }
.spotlight { padding: 0 5vw; }
main { padding: 0 5vw 90px; }
}
</style>

</head>

    ['#E1EAE2', '#C3D8C5'],
    ['#F3E1E7', '#E3BECC'],
    ['#E9E5F5', '#D0C6EA'],
    ['#F5E8DC', '#E4C6A6'],
    ['#E5EEE6', '#C9DBCB'],
  ];

  function paletteFor(seed) {
    let hash = 0;
    for (let i = 0; i < seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
    return coverPalettes[Math.abs(hash) % coverPalettes.length];
  }

  function renderCover(book) {
    const [c1, c2] = paletteFor(book.title);
    return `background: linear-gradient(150deg, ${c1}, ${c2});`;
  }

  const confettiColors = ['#D4A5C4', '#A79ED1', '#9CB89E', '#D69A78', '#E4C6A6'];

  function burstConfetti(originEl) {
    burstConfettiAtRect(originEl ? originEl.getBoundingClientRect() : null);
  }

  function burstConfettiAtRect(rect) {
    const originX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    const originY = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
    const count = 20;

    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const distance = 55 + Math.random() * 85;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 18;
      const rot = (Math.random() - 0.5) * 480;
      const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];

      piece.style.left = originX + 'px';
      piece.style.top = originY + 'px';
      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.setProperty('--rot', rot + 'deg');
      piece.style.animation = `confetti-pop ${0.6 + Math.random() * 0.4}s ease-out forwards`;
      piece.style.background = color;
      if (Math.random() < 0.4) piece.style.borderRadius = '3px';

      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 1100);
    }
  }

  const sampleBooks = [
    { id: 1, title: "The House in the Cerulean Sea", author: "TJ Klune", status: "reading", progress: 62, tags: ["fantasy", "cozy"] },
    { id: 2, title: "Erha / 2ha", author: "肉包不吃肉", status: "reading", progress: 34, tags: ["danmei", "xianxia"] },
    { id: 3, title: "Piranesi", author: "Susanna Clarke", status: "unread", progress: 0, tags: ["fantasy"] },
    { id: 4, title: "Slow Damage", author: "Mikage Sasaki", status: "finished", progress: 100, tags: ["manga"] },
    { id: 5, title: "A Psalm for the Wild-Built", author: "Becky Chambers", status: "unread", progress: 0, tags: ["scifi", "cozy"] },
    { id: 6, title: "Legends & Lattes", author: "Travis Baldree", status: "finished", progress: 100, tags: ["fantasy", "cozy"] },
    { id: 7, title: "Divine Rivals", author: "Rebecca Ross", status: "reading", progress: 18, tags: ["fantasy", "romance"] },
    { id: 8, title: "The Atlas Six", author: "Olivie Blake", status: "unread", progress: 0, tags: ["fantasy", "dark academia"] },
  ];

  let books = [...sampleBooks];
  let activeFilter = 'all';
  let searchTerm = '';

  const grid = document.getElementById('grid');
  const gridLabel = document.getElementById('grid-label');
  const spotlightRow = document.getElementById('spotlight-row');
  const spotlightSection = document.getElementById('spotlight-section');
  const spotlightCount = document.getElementById('spotlight-count');
  const statTotal = document.getElementById('stat-total');
  const statReading = document.getElementById('stat-reading');
  const statFinished = document.getElementById('stat-finished');
  const statUnread = document.getElementById('stat-unread');

  function renderSpotlight() {
    const reading = books.filter(b => b.status === 'reading');
    spotlightCount.textContent = reading.length;
    spotlightSection.style.display = reading.length ? 'block' : 'none';

    spotlightRow.innerHTML = reading.map(book => `
      <div class="spotlight-card" data-id="${book.id}">
        <div class="spotlight-cover" style="${renderCover(book)}"></div>
        <div class="spotlight-info">
          <p class="title">${book.title}</p>
          <p class="author">${book.author}</p>
          <div class="spotlight-progress-track"><span style="width:${book.progress}%"></span></div>
          <p class="spotlight-pct">${book.progress}% done</p>
        </div>
      </div>
    `).join('');

    spotlightRow.querySelectorAll('.spotlight-card').forEach(el => {
      el.addEventListener('click', () => openModal(Number(el.dataset.id)));
    });
  }

  function render() {
    let list = books.filter(b => {
      const matchesFilter = activeFilter === 'all' || b.status === activeFilter;
      const matchesSearch = (b.title + ' ' + b.author).toLowerCase().includes(searchTerm.toLowerCase());
      return matchesFilter && matchesSearch;
    });

    statTotal.textContent = books.length;
    statReading.textContent = books.filter(b => b.status === 'reading').length;
    statFinished.textContent = books.filter(b => b.status === 'finished').length;
    statUnread.textContent = books.filter(b => b.status === 'unread').length;

    renderSpotlight();

    const bookCards = list.map(book => `
      <div class="book" tabindex="0" data-id="${book.id}">
        <div class="cover-wrap">
          <div class="cover" style="${renderCover(book)}">
            ${book.isNew ? `<span class="new-badge">new!</span>` : ''}
            <span class="cover-title">${book.title}</span>
          </div>
          <div class="ground-shadow"></div>
        </div>
        <div class="meta">
          <p class="title">${book.title}</p>
          <p class="author">${book.author}</p>
          ${book.progress > 0 && book.progress < 100 ? `
            <div class="progress-bar"><span style="width:${book.progress}%"></span></div>
          ` : ''}
        </div>
      </div>
    `).join('');

    const addTile = `
      <div class="book add-book" id="add-book-tile" tabindex="0">
        <div class="cover-wrap">
          <div class="cover">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
        </div>
        <div class="meta"><p class="title">add a book</p></div>
      </div>
    `;

    if (list.length === 0) {
      grid.innerHTML = `<div class="empty-state"><span class="empty-icon">🌙📖</span>this corner of the shelf is empty<br>try another search, or add something new!</div>` + addTile;
    } else {
      grid.innerHTML = bookCards + addTile;
    }

    document.querySelectorAll('.book:not(.add-book)').forEach(el => {
      el.addEventListener('click', () => openModal(Number(el.dataset.id)));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(Number(el.dataset.id)); });
    });

    document.getElementById('add-book-tile').addEventListener('click', () => {
      document.getElementById('file-input').click();
    });
  }

  /* ---------------------------------------------------------
     MODAL
  --------------------------------------------------------- */
  const backdrop = document.getElementById('modal-backdrop');
  let currentBookId = null;

  function fillViewMode(book) {
    document.getElementById('modal-title').textContent = book.title;
    document.getElementById('modal-author').textContent = book.author;
    document.getElementById('modal-cover').style.cssText = renderCover(book);
    document.getElementById('modal-cover').innerHTML = `<span class="cover-title">${book.title}</span>`;
    document.getElementById('modal-tags').innerHTML = book.tags.map(t => `<span>${t}</span>`).join('');
  }

  function fillEditMode(book) {
    document.getElementById('edit-title').value = book.title;
    document.getElementById('edit-author').value = book.author;
    document.getElementById('edit-tags').value = book.tags.join(', ');
    document.getElementById('edit-status').value = book.status;
    document.getElementById('edit-cover-preview').style.cssText = renderCover(book);
    document.getElementById('edit-cover-preview').innerHTML = `<span class="cover-title">${book.title}</span>`;
  }

  function setEditing(isEditing) {
    document.getElementById('view-mode').style.display = isEditing ? 'none' : 'grid';
    document.getElementById('edit-mode').style.display = isEditing ? 'grid' : 'none';
    document.getElementById('modal-edit-toggle').style.display = isEditing ? 'none' : 'flex';
  }

  function openModal(id) {
    const book = books.find(b => b.id === id);
    if (!book) return;
    currentBookId = id;
    fillViewMode(book);
    fillEditMode(book);
    setEditing(false);
    backdrop.classList.add('open');
    if (book.isNew) {
      book.isNew = false;
      render();
    }
  }

  function closeModal() {
    backdrop.classList.remove('open');
    setEditing(false);
    currentBookId = null;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('modal-edit-toggle').addEventListener('click', () => setEditing(true));
  document.getElementById('edit-cancel-btn').addEventListener('click', () => {
    const book = books.find(b => b.id === currentBookId);
    fillEditMode(book);
    setEditing(false);
  });

  document.getElementById('edit-save-btn').addEventListener('click', (e) => {
    const book = books.find(b => b.id === currentBookId);
    if (!book) return;
    const newTitle = document.getElementById('edit-title').value.trim();
    book.title = newTitle || book.title;
    book.author = document.getElementById('edit-author').value.trim() || 'unknown author';
    book.tags = document.getElementById('edit-tags').value
      .split(',').map(t => t.trim()).filter(Boolean);
    book.status = document.getElementById('edit-status').value;
    if (book.status === 'finished') book.progress = 100;
    if (book.status === 'unread') book.progress = 0;
    if (book.status === 'reading' && book.progress === 0) book.progress = 5;
    book.isNew = false;

    fillViewMode(book);
    setEditing(false);
    burstConfetti(e.currentTarget);
    render();
  });

  document.getElementById('modal-remove-btn').addEventListener('click', () => {
    books = books.filter(b => b.id !== currentBookId);
    closeModal();
    render();
  });

  document.getElementById('modal-open-btn').addEventListener('click', () => {
    // Placeholder: wire this up to an actual epub reader later
    // (e.g. epub.js) once real files are loaded.
    alert("Reader view isn't wired up yet — this is where your epub would open!");
  });

  /* ---------------------------------------------------------
     SEARCH + FILTER TABS
  --------------------------------------------------------- */
  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value;
    render();
  });

  document.getElementById('shelf-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.shelf-tab');
    if (!btn) return;
    document.querySelectorAll('.shelf-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    gridLabel.childNodes[0].textContent = (activeFilter === 'all' ? 'your shelf' : activeFilter) + ' ';
    render();
  });

  /* ---------------------------------------------------------
     FILE INPUT (placeholder — adds a stub entry for now)
     Real epub parsing (title/author/cover) can be added later
     using a library like epub.js, run client-side.
  --------------------------------------------------------- */
  document.getElementById('file-input').addEventListener('change', e => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    files.forEach(file => {
      const title = file.name.replace(/\.epub$/i, '');
      books.push({
        id: Date.now() + Math.random(),
        title,
        author: "unknown author",
        status: "unread",
        progress: 0,
        tags: ["new"],
        isNew: true
      });
    });

    const addTile = document.getElementById('add-book-tile');
    const rect = addTile ? addTile.getBoundingClientRect() : null;
    render();
    burstConfettiAtRect(rect);
    e.target.value = '';
  });

  render();
</script>

</body>
</html>
